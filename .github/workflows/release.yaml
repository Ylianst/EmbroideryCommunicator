name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

env:
  BASE_URL: https://ylianst.github.io/EmbroideryCommunicator

jobs:
  # ---------------------------------------------------------------------------
  # Windows (x64) desktop build
  # ---------------------------------------------------------------------------
  build-windows:
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      build_number: ${{ steps.version.outputs.build_number }}
    steps:
      - uses: actions/checkout@v4

      - name: Extract version from tag
        id: version
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}" -replace '^v', ''
          $version = $tag
          # Use build number from pubspec.yaml
          $pubspec = Get-Content src/pubspec.yaml -Raw
          if ($pubspec -match 'version:\s*[\d.]+\+(\d+)') {
            $buildNumber = $Matches[1]
          } else {
            $buildNumber = "1"
          }
          echo "version=$version" >> $env:GITHUB_OUTPUT
          echo "build_number=$buildNumber" >> $env:GITHUB_OUTPUT
          echo "Version: $version, Build: $buildNumber"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies
        working-directory: src
        run: flutter pub get

      - name: Build Windows
        working-directory: src
        run: flutter build windows --release

      # --- Code signing (disabled for now) -----------------------------------
      # - name: Sign Windows executable
      #   uses: azure/trusted-signing-action@v0.4.0
      #   with:
      #     azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
      #     azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
      #     azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
      #     endpoint: ${{ secrets.AZURE_ENDPOINT }}
      #     trusted-signing-account-name: ${{ secrets.AZURE_CODE_SIGNING_ACCOUNT_NAME }}
      #     certificate-profile-name: ${{ secrets.AZURE_CERTIFICATE_PROFILE_NAME }}
      #     files-folder: src\build\windows\x64\runner\Release
      #     files-folder-filter: exe
      #     file-digest: SHA256
      #     timestamp-rfc3161: http://timestamp.acs.microsoft.com
      #     timestamp-digest: SHA256

      - name: Package Windows zip
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $buildDir = "src\build\windows\x64\runner\Release"
          $zipName = "EmbroideryCommunicator-windows-x64.zip"
          Compress-Archive -Path "$buildDir\*" -DestinationPath $zipName -Force

      - name: Generate update package
        shell: pwsh
        working-directory: src
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $buildNumber = "${{ steps.version.outputs.build_number }}"
          dart run desktop_updater:package `
            --input build/windows/x64/runner/Release `
            --output dist/desktop_updater/releases/$version/windows-x64 `
            --package-id com.ylianst.embroideryCommunicator `
            --app-name embroidery_communicator `
            --version $version `
            --build-number $buildNumber `
            --platform windows `
            --channel stable `
            --install-strategy wholeDirectoryReplace `
            --artifact-url "https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/embroidery_communicator-$version-windows-x64.zip"

          # desktop_updater names the archive without the arch suffix
          # (embroidery_communicator-<version>-windows.zip); rename it to match
          # the arch-suffixed URL that the self-updater downloads.
          $outDir = "dist/desktop_updater/releases/$version/windows-x64"
          $srcZip = Join-Path $outDir "embroidery_communicator-$version-windows.zip"
          $dstZip = Join-Path $outDir "embroidery_communicator-$version-windows-x64.zip"
          if (Test-Path $srcZip) { Move-Item -Force $srcZip $dstZip }

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: EmbroideryCommunicator-windows-x64.zip

      - name: Upload update package
        uses: actions/upload-artifact@v4
        with:
          name: windows-update-x64
          path: src/dist/desktop_updater/releases/

  # ---------------------------------------------------------------------------
  # Linux (x64 + arm64) desktop build
  # ---------------------------------------------------------------------------
  build-linux:
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - arch: x64
            runner: ubuntu-latest
            deb_arch: amd64
            appimagetool_arch: x86_64
          - arch: arm64
            runner: ubuntu-24.04-arm
            deb_arch: arm64
            appimagetool_arch: aarch64
    outputs:
      version: ${{ steps.version.outputs.version }}
      build_number: ${{ steps.version.outputs.build_number }}
    steps:
      - uses: actions/checkout@v4

      - name: Extract version from tag
        id: version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          BUILD_NUMBER=$(grep '^version:' src/pubspec.yaml | sed 's/.*+//')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "build_number=$BUILD_NUMBER" >> "$GITHUB_OUTPUT"
          echo "Version: $VERSION, Build: $BUILD_NUMBER"

      # Flutter publishes prebuilt SDK archives for x64 only, so the marketplace
      # action works for x64 but fails on arm64. On arm64 we install from git,
      # whose bootstrap downloads the correct arm64 Dart SDK and engine.
      - name: Set up Flutter (x64)
        if: matrix.arch == 'x64'
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Set up Flutter (arm64)
        if: matrix.arch == 'arm64'
        run: |
          git clone https://github.com/flutter/flutter.git --depth 1 --branch stable "$HOME/flutter"
          git config --global --add safe.directory "$HOME/flutter"
          echo "$HOME/flutter/bin" >> "$GITHUB_PATH"
          "$HOME/flutter/bin/flutter" --version
          "$HOME/flutter/bin/flutter" precache --linux

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgtk-3-dev liblzma-dev libstdc++-12-dev pkg-config cmake clang libserialport-dev

      - name: Install dependencies
        working-directory: src
        run: flutter pub get

      - name: Build Linux
        working-directory: src
        run: flutter build linux --release

      - name: Package tar.gz
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          cd src/build/linux/${{ matrix.arch }}/release/bundle
          tar -czf "$GITHUB_WORKSPACE/EmbroideryCommunicator-linux-${{ matrix.arch }}.tar.gz" .

      - name: Package .deb
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          PKG_DIR="ec-deb"
          mkdir -p "$PKG_DIR/DEBIAN"
          mkdir -p "$PKG_DIR/usr/lib/embroidery_communicator"
          mkdir -p "$PKG_DIR/usr/bin"
          mkdir -p "$PKG_DIR/usr/share/applications"
          mkdir -p "$PKG_DIR/usr/share/icons/hicolor/256x256/apps"

          cp -r src/build/linux/${{ matrix.arch }}/release/bundle/* "$PKG_DIR/usr/lib/embroidery_communicator/"
          ln -sf /usr/lib/embroidery_communicator/embroidery_communicator "$PKG_DIR/usr/bin/embroidery_communicator"

          cat > "$PKG_DIR/usr/share/applications/embroidery_communicator.desktop" <<EOF
          [Desktop Entry]
          Name=Embroidery Communicator
          Comment=Communicate with Bernina Artista embroidery machines over serial or network
          Exec=/usr/bin/embroidery_communicator
          Icon=embroidery_communicator
          Type=Application
          Categories=Utility;
          Terminal=false
          EOF
          sed -i 's/^          //' "$PKG_DIR/usr/share/applications/embroidery_communicator.desktop"

          cp src/macos/Runner/Assets.xcassets/AppIcon.appiconset/app_icon_256.png \
            "$PKG_DIR/usr/share/icons/hicolor/256x256/apps/embroidery_communicator.png"

          cat > "$PKG_DIR/DEBIAN/control" <<EOF
          Package: embroidery-communicator
          Version: ${VERSION}
          Section: utils
          Priority: optional
          Architecture: ${{ matrix.deb_arch }}
          Depends: libgtk-3-0, libserialport0
          Maintainer: Embroidery Communicator <embroiderycommunicator@users.noreply.github.com>
          Description: Embroidery Communicator
           Cross-platform tool to communicate with Bernina Artista embroidery
           machines over serial or network.
          EOF
          sed -i 's/^          //' "$PKG_DIR/DEBIAN/control"

          dpkg-deb --build "$PKG_DIR" "EmbroideryCommunicator-linux-${{ matrix.arch }}.deb"

      - name: Package AppImage
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          APPDIR="EmbroideryCommunicator.AppDir"

          mkdir -p "$APPDIR/usr/bin"
          mkdir -p "$APPDIR/usr/share/applications"
          mkdir -p "$APPDIR/usr/share/icons/hicolor/256x256/apps"

          # Copy build output
          cp -r src/build/linux/${{ matrix.arch }}/release/bundle/* "$APPDIR/usr/bin/"

          # Desktop file
          cat > "$APPDIR/embroidery_communicator.desktop" <<EOF
          [Desktop Entry]
          Name=Embroidery Communicator
          Comment=Communicate with Bernina Artista embroidery machines over serial or network
          Exec=embroidery_communicator
          Icon=embroidery_communicator
          Type=Application
          Categories=Utility;
          Terminal=false
          EOF
          sed -i 's/^          //' "$APPDIR/embroidery_communicator.desktop"
          cp "$APPDIR/embroidery_communicator.desktop" "$APPDIR/usr/share/applications/embroidery_communicator.desktop"

          # Icon
          cp src/macos/Runner/Assets.xcassets/AppIcon.appiconset/app_icon_256.png "$APPDIR/embroidery_communicator.png"
          cp src/macos/Runner/Assets.xcassets/AppIcon.appiconset/app_icon_256.png "$APPDIR/usr/share/icons/hicolor/256x256/apps/embroidery_communicator.png"

          # AppRun script
          cat > "$APPDIR/AppRun" <<'EOF'
          #!/bin/bash
          SELF=$(readlink -f "$0")
          HERE=${SELF%/*}
          export PATH="${HERE}/usr/bin:${PATH}"
          export LD_LIBRARY_PATH="${HERE}/usr/bin/lib:${HERE}/usr/lib:${LD_LIBRARY_PATH}"
          exec "${HERE}/usr/bin/embroidery_communicator" "$@"
          EOF
          sed -i 's/^          //' "$APPDIR/AppRun"
          chmod +x "$APPDIR/AppRun"

          # Download appimagetool
          wget -q "https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-${{ matrix.appimagetool_arch }}.AppImage" -O appimagetool
          chmod +x appimagetool

          # Build AppImage
          ARCH=${{ matrix.appimagetool_arch }} ./appimagetool --no-appstream "$APPDIR" "EmbroideryCommunicator-linux-${{ matrix.arch }}.AppImage"

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.arch }}
          path: |
            EmbroideryCommunicator-linux-${{ matrix.arch }}.tar.gz
            EmbroideryCommunicator-linux-${{ matrix.arch }}.deb
            EmbroideryCommunicator-linux-${{ matrix.arch }}.AppImage

      - name: Generate update package
        working-directory: src
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          BUILD_NUMBER="${{ steps.version.outputs.build_number }}"
          dart run desktop_updater:package \
            --input build/linux/${{ matrix.arch }}/release/bundle \
            --output dist/desktop_updater/releases/$VERSION/linux-${{ matrix.arch }} \
            --package-id com.ylianst.embroideryCommunicator \
            --app-name embroidery_communicator \
            --version "$VERSION" \
            --build-number "$BUILD_NUMBER" \
            --platform linux \
            --channel stable \
            --install-strategy wholeDirectoryReplace \
            --artifact-url "https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/embroidery_communicator-$VERSION-linux-${{ matrix.arch }}.zip"

          # desktop_updater names the archive without the arch suffix; rename it
          # to match the arch-suffixed URL that the self-updater downloads.
          OUT_DIR="dist/desktop_updater/releases/$VERSION/linux-${{ matrix.arch }}"
          SRC_ZIP="$OUT_DIR/embroidery_communicator-$VERSION-linux.zip"
          DST_ZIP="$OUT_DIR/embroidery_communicator-$VERSION-linux-${{ matrix.arch }}.zip"
          if [ -f "$SRC_ZIP" ]; then mv -f "$SRC_ZIP" "$DST_ZIP"; fi

      - name: Upload update package
        uses: actions/upload-artifact@v4
        with:
          name: linux-update-${{ matrix.arch }}
          path: src/dist/desktop_updater/releases/

  # ---------------------------------------------------------------------------
  # macOS desktop build
  # ---------------------------------------------------------------------------
  build-macos:
    runs-on: macos-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      build_number: ${{ steps.version.outputs.build_number }}
    steps:
      - uses: actions/checkout@v4

      - name: Extract version from tag
        id: version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          BUILD_NUMBER=$(grep '^version:' src/pubspec.yaml | sed 's/.*+//')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "build_number=$BUILD_NUMBER" >> "$GITHUB_OUTPUT"
          echo "Version: $VERSION, Build: $BUILD_NUMBER"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      # The libserialport CocoaPod builds from source and needs autotools.
      - name: Install macOS build dependencies
        run: brew install automake libtool

      - name: Install dependencies
        working-directory: src
        run: flutter pub get

      - name: Build macOS (unsigned)
        working-directory: src
        run: |
          # CI can't use Xcode automatic signing (no "Mac Development" cert),
          # so build unsigned here. Developer ID signing / notarization is
          # disabled for now (see commented-out steps below).
          {
            echo 'CODE_SIGN_IDENTITY='
            echo 'CODE_SIGNING_REQUIRED=NO'
            echo 'CODE_SIGNING_ALLOWED=NO'
          } >> macos/Runner/Configs/Release.xcconfig
          flutter build macos --release

      # --- Code signing / notarization (disabled for now) --------------------
      # - name: Import Developer ID certificate
      #   env:
      #     MACOS_CERTIFICATE_BASE64: ${{ secrets.MACOS_CERTIFICATE_BASE64 }}
      #     MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
      #     MACOS_KEYCHAIN_PASSWORD: ${{ secrets.MACOS_KEYCHAIN_PASSWORD }}
      #   run: |
      #     CERT_PATH="$RUNNER_TEMP/certificate.p12"
      #     KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
      #     echo -n "$MACOS_CERTIFICATE_BASE64" | base64 --decode -o "$CERT_PATH"
      #     security create-keychain -p "$MACOS_KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
      #     security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
      #     security unlock-keychain -p "$MACOS_KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
      #     security import "$CERT_PATH" -P "$MACOS_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
      #     security set-key-partition-list -S apple-tool:,apple: -k "$MACOS_KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
      #     security list-keychain -d user -s "$KEYCHAIN_PATH" login.keychain
      #
      # - name: Sign and notarize app
      #   env:
      #     MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
      #     MACOS_NOTARY_KEY_BASE64: ${{ secrets.MACOS_NOTARY_KEY_BASE64 }}
      #     MACOS_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
      #     MACOS_NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
      #   run: |
      #     APP_PATH=$(find src/build/macos/Build/Products/Release -name "*.app" -maxdepth 1 | head -1)
      #     find "$APP_PATH/Contents/Frameworks" -type f \( -name "*.dylib" -o -name "*.so" \) -exec \
      #       codesign --force --timestamp --options runtime --sign "$MACOS_SIGNING_IDENTITY" {} +
      #     find "$APP_PATH/Contents/Frameworks" -type d -name "*.framework" -exec \
      #       codesign --force --timestamp --options runtime --sign "$MACOS_SIGNING_IDENTITY" {} +
      #     codesign --force --timestamp --options runtime \
      #       --entitlements src/macos/Runner/Release.entitlements \
      #       --sign "$MACOS_SIGNING_IDENTITY" "$APP_PATH"
      #     NOTARY_KEY="$RUNNER_TEMP/notary_key.p8"
      #     echo -n "$MACOS_NOTARY_KEY_BASE64" | base64 --decode -o "$NOTARY_KEY"
      #     ditto -c -k --keepParent "$APP_PATH" "$RUNNER_TEMP/notarize.zip"
      #     xcrun notarytool submit "$RUNNER_TEMP/notarize.zip" \
      #       --key "$NOTARY_KEY" --key-id "$MACOS_NOTARY_KEY_ID" --issuer "$MACOS_NOTARY_ISSUER_ID" --wait
      #     xcrun stapler staple "$APP_PATH"

      - name: Create DMG
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          APP_PATH=$(find src/build/macos/Build/Products/Release -name "*.app" -maxdepth 1 | head -1)
          DMG_NAME="EmbroideryCommunicator-macos.dmg"
          VOLUME_NAME="Embroidery Communicator"
          STAGING_DIR="dmg_staging"

          echo "Found app: $APP_PATH"
          mkdir -p "$STAGING_DIR"
          cp -R "$APP_PATH" "$STAGING_DIR/"
          ln -s /Applications "$STAGING_DIR/Applications"

          hdiutil create -volname "$VOLUME_NAME" -srcfolder "$STAGING_DIR" -ov -format UDZO -imagekey zlib-level=9 -o "$DMG_NAME"

      - name: Generate update package
        working-directory: src
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          BUILD_NUMBER="${{ steps.version.outputs.build_number }}"
          APP_PATH=$(find build/macos/Build/Products/Release -name "*.app" -maxdepth 1 | head -1)
          dart run desktop_updater:package \
            --input "$APP_PATH" \
            --output dist/desktop_updater/releases/$VERSION/macos \
            --package-id com.ylianst.embroideryCommunicator \
            --app-name "$(basename "$APP_PATH")" \
            --version "$VERSION" \
            --build-number "$BUILD_NUMBER" \
            --platform macos \
            --channel stable \
            --install-strategy wholeBundleReplace \
            --artifact-url "https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/embroidery_communicator-$VERSION-macos.zip"

          # desktop_updater names the archive after the .app bundle; rename it
          # to the URL the self-updater downloads.
          OUT_DIR="dist/desktop_updater/releases/$VERSION/macos"
          DST_ZIP="$OUT_DIR/embroidery_communicator-$VERSION-macos.zip"
          SRC_ZIP=$(find "$OUT_DIR" -maxdepth 1 -name '*.zip' ! -name "$(basename "$DST_ZIP")" | head -1)
          if [ -n "$SRC_ZIP" ] && [ -f "$SRC_ZIP" ]; then mv -f "$SRC_ZIP" "$DST_ZIP"; fi

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos
          path: EmbroideryCommunicator-macos.dmg

      - name: Upload update package
        uses: actions/upload-artifact@v4
        with:
          name: macos-update
          path: src/dist/desktop_updater/releases/

  # ---------------------------------------------------------------------------
  # Publish GitHub Release with all desktop artifacts
  # ---------------------------------------------------------------------------
  release:
    needs: [build-windows, build-linux, build-macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies
        working-directory: src
        run: flutter pub get

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Assemble update site
        working-directory: src
        run: |
          VERSION="${{ needs.build-windows.outputs.version }}"
          BUILD_NUMBER="${{ needs.build-windows.outputs.build_number }}"
          BASE_URL="${{ env.BASE_URL }}"

          mkdir -p dist/desktop_updater/releases

          # Copy all platform release packages (release.json + zips).
          cp -r ../artifacts/windows-update-x64/* dist/desktop_updater/releases/ || true
          cp -r ../artifacts/linux-update-x64/* dist/desktop_updater/releases/ || true
          cp -r ../artifacts/linux-update-arm64/* dist/desktop_updater/releases/ || true
          cp -r ../artifacts/macos-update/* dist/desktop_updater/releases/ || true

          # Generate the combined app-archive.json referencing every platform.
          dart run desktop_updater:app_archive upsert \
            --archive dist/desktop_updater/app-archive.json \
            --app-name "Embroidery Communicator" \
            --version "$VERSION" \
            --build-number "$BUILD_NUMBER" \
            --platform windows \
            --channel stable \
            --release-url "$BASE_URL/releases/$VERSION/windows-x64/release.json"

          dart run desktop_updater:app_archive upsert \
            --archive dist/desktop_updater/app-archive.json \
            --app-name "Embroidery Communicator" \
            --version "$VERSION" \
            --build-number "$BUILD_NUMBER" \
            --platform linux \
            --channel stable \
            --release-url "$BASE_URL/releases/$VERSION/linux-x64/release.json"

          dart run desktop_updater:app_archive upsert \
            --archive dist/desktop_updater/app-archive.json \
            --app-name "Embroidery Communicator" \
            --version "$VERSION" \
            --build-number "$BUILD_NUMBER" \
            --platform linux \
            --channel stable \
            --release-url "$BASE_URL/releases/$VERSION/linux-arm64/release.json"

          dart run desktop_updater:app_archive upsert \
            --archive dist/desktop_updater/app-archive.json \
            --app-name "Embroidery Communicator" \
            --version "$VERSION" \
            --build-number "$BUILD_NUMBER" \
            --platform macos \
            --channel stable \
            --release-url "$BASE_URL/releases/$VERSION/macos/release.json"

          echo "=== app-archive.json ==="
          cat dist/desktop_updater/app-archive.json

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Embroidery Communicator ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            artifacts/windows-x64/EmbroideryCommunicator-windows-x64.zip
            artifacts/linux-x64/EmbroideryCommunicator-linux-x64.tar.gz
            artifacts/linux-x64/EmbroideryCommunicator-linux-x64.deb
            artifacts/linux-x64/EmbroideryCommunicator-linux-x64.AppImage
            artifacts/linux-arm64/EmbroideryCommunicator-linux-arm64.tar.gz
            artifacts/linux-arm64/EmbroideryCommunicator-linux-arm64.deb
            artifacts/linux-arm64/EmbroideryCommunicator-linux-arm64.AppImage
            artifacts/macos/EmbroideryCommunicator-macos.dmg
            artifacts/windows-update-x64/**/*.zip
            artifacts/linux-update-x64/**/*.zip
            artifacts/linux-update-arm64/**/*.zip
            artifacts/macos-update/**/*.zip

      - name: Deploy update site to docs folder
        run: |
          cp -r src/dist/desktop_updater/* docs/
          # The self-updater downloads the zip payloads from the GitHub Release
          # (see the artifact.url in each release.json), so the zips are not kept
          # in the repository. Only the JSON metadata is committed to docs/.
          find docs/releases -name '*.zip' -delete
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/app-archive.json docs/releases/
          git commit -m "Update desktop_updater metadata for ${{ needs.build-windows.outputs.version }}" || echo "No changes to commit"
          git push origin main

  # ---------------------------------------------------------------------------
  # Build the web version and publish it into docs/app for GitHub Pages.
  # Only the latest build is kept (the previous one is replaced each release).
  # ---------------------------------------------------------------------------
  deploy-web:
    needs: [release]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies
        working-directory: src
        run: flutter pub get

      - name: Build Web
        working-directory: src
        run: flutter build web --release --base-href "/${{ github.event.repository.name }}/app/"

      - name: Publish web build to docs/app
        run: |
          # Replace the previous web build so only the latest version is kept.
          rm -rf docs/app
          mkdir -p docs/app
          cp -r src/build/web/* docs/app/
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/app
          git commit -m "Deploy web build ${{ github.ref_name }}" || echo "No changes to commit"
          git push origin main
