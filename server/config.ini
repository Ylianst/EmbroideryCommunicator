# Embroidery Server configuration (optional).
# If this file is missing, the defaults below are used.

[http]
# Port the HTTP + WebSocket server listens on.
port = 8080
# Host/interface to bind to (0.0.0.0 = all interfaces).
host = 0.0.0.0
# Folder containing the built Flutter web app. Relative paths are resolved
# against the server directory. Defaults to ../docs/app.
webRoot = ../docs/app

[ws]
# Path the browser app connects to for the machine relay.
path = /ws

[serial]
# Serial device the embroidery machine is attached to.
port = /dev/ttyUSB0
